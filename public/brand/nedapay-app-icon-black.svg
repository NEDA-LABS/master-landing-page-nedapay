<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- NEDApay app icon, black: a soft, slightly puffed tile with a stitched
       white mark. The mark path is the supplied vector, unaltered. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3E40"/>
      <stop offset="1" stop-color="#17191A"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="thread" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4E4E2"/>
    </linearGradient>
    <filter id="puff" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.6" result="b"/>
      <feSpecularLighting in="b" surfaceScale="3" specularConstant="0.55" specularExponent="18" lighting-color="#FFFFFF" result="s">
        <feDistantLight azimuth="235" elevation="50"/>
      </feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="sIn"/>
      <feComposite in="SourceGraphic" in2="sIn" operator="arithmetic" k2="1" k3="0.6"/>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.4" stdDeviation="1.1" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="markClip"><path transform="translate(22 24.9) scale(0.3227) translate(-76.465 -371.18)" d="M 76.464844 371.179688 L 130.136719 371.179688 L 130.136719 463.609375 L 91.375 463.609375 L 76.464844 448.699219 Z M 195.730469 371.179688 L 274.742188 371.179688 L 312.011719 408.449219 L 312.011719 463.609375 L 241.945312 463.609375 L 195.730469 415.902344 Z M 76.464844 490.441406 L 148.023438 490.441406 L 195.730469 538.148438 L 195.730469 588.835938 L 113.738281 588.835938 L 76.464844 550.074219 Z M 267.289062 490.441406 L 312.011719 490.441406 L 312.011719 588.835938 L 267.289062 544.113281 Z M 77.957031 371.179688 L 121.191406 371.179688 L 312.011719 562 L 312.011719 588.835938 L 295.613281 588.835938 Z M 77.957031 371.179688 "/></clipPath>
  </defs>
  <rect x="2" y="2" width="116" height="116" rx="27" fill="url(#tile)"/>
  <rect x="2.5" y="2.5" width="115" height="115" rx="26.5" fill="none" stroke="url(#rim)" stroke-width="1"/>
  <g filter="url(#lift)">
    <g filter="url(#puff)">
      <path transform="translate(22 24.9) scale(0.3227) translate(-76.465 -371.18)" d="M 76.464844 371.179688 L 130.136719 371.179688 L 130.136719 463.609375 L 91.375 463.609375 L 76.464844 448.699219 Z M 195.730469 371.179688 L 274.742188 371.179688 L 312.011719 408.449219 L 312.011719 463.609375 L 241.945312 463.609375 L 195.730469 415.902344 Z M 76.464844 490.441406 L 148.023438 490.441406 L 195.730469 538.148438 L 195.730469 588.835938 L 113.738281 588.835938 L 76.464844 550.074219 Z M 267.289062 490.441406 L 312.011719 490.441406 L 312.011719 588.835938 L 267.289062 544.113281 Z M 77.957031 371.179688 L 121.191406 371.179688 L 312.011719 562 L 312.011719 588.835938 L 295.613281 588.835938 Z M 77.957031 371.179688 " fill="url(#thread)"/>
